
name: Build Unlogic AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'unlogic_ai_multiengine_v04.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q unlogic_ai_multiengine_v04.zip -d unpacked
          cp -a unpacked/unlogic_ai_starter/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unlogic-ai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
